name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Create .env
      run: |
        echo "VITE_GATEWAY_URL=${{ secrets.VITE_GATEWAY_URL }}" > .env
        cat .env  # Debugging step to verify contents

    - name: Install Dependencies
      run: yarn install --frozen-lockfile

    - name: Build React App
      run: |
        export CI=false 
        npm run build  

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to Server
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
        
        ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
          cd /var/www/spoilert-web-app-admin
          
          sudo chown -R $USER:$USER .
          
          git reset --hard        # Discard any local changes
          git clean -fd           # Remove untracked files
          git pull origin main --rebase  # Pull the latest changes

          sudo chown -R www-data:www-data /var/www/spoilert-web-app-admin
          sudo chmod -R 755 /var/www/spoilert-web-app-admin
        EOF

        rsync -avz --delete-after \
          ./dist/ $SERVER_USER@$SERVER_IP:/var/www/spoilert-web-app-admin/dist

        ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
          sudo systemctl restart nginx
        EOF
